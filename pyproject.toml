[project]
name = "cynbit-inquiry-blueprint"
version = "0.1.0"
description = "AI-powered client inquiry analysis and solution blueprint generator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "groq>=1.0,<2",
    "pydantic>=2.7,<2.13",
    "pydantic-settings>=2.3,<3",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "streamlit>=1.66,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]